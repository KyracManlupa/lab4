
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body class="login-page">

    <main class="login-wrapper">
        <div class="login-decoration decoration-one"></div>
        <div class="login-decoration decoration-two"></div>

        <section class="login-card">

            <div class="login-brand">
                <span class="login-brand-mark">S</span>
                <div>
                    <h1>Student Portal</h1>
                    <p>YOUR ACADEMIC SPACE</p>
                </div>
            </div>

            <div class="login-heading">
                <p class="login-eyebrow">WELCOME BACK</p>
                <h2>Sign in to continue</h2>
                <p>Access your courses, grades, and academic progress.</p>
            </div>

            <div id="loginAlert" aria-live="polite"></div>

            <form id="loginForm">
                <div class="login-field">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="button"
                    id="loginBtn"
                    class="login-submit"
                >
                    <span>Login to Dashboard</span>
                    <span class="login-arrow">→</span>
                </button>
            </form>

            <div class="login-footer">
                <span class="login-footer-line"></span>
                <p>Student Portal <span>•</span> Academic Dashboard</p>
                <span class="login-footer-line"></span>
            </div>

        </section>

        <p class="login-bottom-note">
            YOUR LEARNING JOURNEY STARTS HERE
        </p>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
